name: Foundry Review

on:
  workflow_call:

jobs:
  required-files:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check required files
        run: |
          for f in module.json README.md LICENSE; do
            if [ ! -f "$f" ]; then
              echo "::error::Missing required file: $f"
              exit 1
            fi
          done

  referenced-files:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check files referenced in module.json
        run: |
          node - <<'NODE'
          const fs = require("fs");
          const j = JSON.parse(fs.readFileSync("module.json", "utf8"));
          const paths = [
            ...(j.esmodules || []),
            ...(j.styles || []),
            ...(j.languages || []).map(l => l.path),
            ...(j.packs || []).map(p => p.path),
          ];
          let failed = false;
          for (const p of paths) {
            if (!fs.existsSync(p)) {
              console.error(`::error::Referenced file missing: ${p}`);
              failed = true;
            }
          }
          if (failed) process.exit(1);
          NODE

  version-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Version higher than latest tag
        run: |
          node - <<'NODE'
          const fs = require("fs");
          const { execSync } = require("child_process");
          const j = JSON.parse(fs.readFileSync("module.json", "utf8"));
          const v = j.version;
          if (!/^\d+\.\d+\.\d+$/.test(v)) {
            console.error(`::error::module.json version invalid: ${v}`);
            process.exit(1);
          }
          let lastTag = "";
          try { lastTag = execSync("git tag --list 'v*' --sort=-v:refname").toString().split("\n")[0]; } catch {}
          if (lastTag) {
            const cur = lastTag.replace(/^v/, "").split(".").map(Number);
            const next = v.split(".").map(Number);
            const higher = next[0] > cur[0] || (next[0] === cur[0] && next[1] > cur[1]) || (next[0] === cur[0] && next[1] === cur[1] && next[2] > cur[2]);
            if (!higher && lastTag !== `v${v}`) {
              console.error(`::error::module.json version ${v} is not higher than latest tag ${lastTag}`);
              process.exit(1);
            }
          }
          NODE

  version-consistency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Version consistent across repo
        run: |
          node - <<'NODE'
          const fs = require("fs");
          const j = JSON.parse(fs.readFileSync("module.json", "utf8"));
          const v = j.version;
          const targets = ["package.json"];
          let failed = false;
          for (const f of targets) {
            if (!fs.existsSync(f)) continue;
            const data = JSON.parse(fs.readFileSync(f, "utf8"));
            if (data.version && data.version !== v) {
              console.error(`::error::Version mismatch in ${f}: ${data.version} !== ${v}`);
              failed = true;
            }
          }
          if (failed) process.exit(1);
          NODE

  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
